dr-head-big-raw=Big demolisher head
dr-head-big-cryo=Cryo-preserved big demolisher head

[item-description]
dr-head-small-raw=Still warm. It will not keep, and nothing can make it keep: embalming dries it out, cryogenics shatter it. Mount it while it's fresh.
dr-head-medium-raw=Too massive to mount raw; it falls apart under its own weight. Gleba embalming can make it convincing. On a timer until then.
dr-head-medium-embalmed=Gleba biochemistry keeps the tissue convincing indefinitely, provided the effigy is fed.
dr-head-big-raw=An entire rocket, for one head. Cannot be mounted or merely embalmed: only full cryo-preservation holds a mass like this together. Spoils like everything else on this planet.
dr-head-big-cryo=Bioflux-treated, lithium-framed, frozen mid-snarl. Needs nothing but electricity, forever. One power outage away from a very bad week.

[technology-name]
dr-seismic-monitoring=Seismic monitoring
dr-demolisher-ethology=Demolisher ethology
dr-cadaver-embalming=Cadaver embalming
dr-cryogenic-taxidermy=Cryogenic taxidermy

[technology-description]
dr-seismic-monitoring=Seismograph stations reveal demolisher territory state on the map within their detection radius and warn of incoming migrations. Without coverage, the planet keeps its secrets.
dr-demolisher-ethology=Understanding of demolisher territorial behaviour. Unlocks the small territorial effigy. Becomes available for research only after your force has killed its first demolisher: you cannot study what you have not dissected.
dr-cadaver-embalming=Gleba bioflux treatment stops a medium head from rotting. Unlocks the medium territorial effigy, which must be fed calcite and tungsten while there is an audience to deceive.
dr-cryogenic-taxidermy=Aquilo cryogenics preserve a big head indefinitely with no feed at all, in exchange for constant refrigeration power. Unlocks the grand territorial effigy. The lie becomes infrastructure.

