[mod-setting-description]
dr-territory-radius=Ownership radius of each demolisher territory in chunks. Vanilla = 4. Lower = more, smaller territories.
dr-tier-chunk-stride=Distance in chunks between tier thresholds. Vanilla = 18. Increase to push stronger tiers further from the starting area.
dr-territory-voronoi-size=Geographic spacing of territory centres in tiles. Vanilla = 384. Increase to spread territories further apart.
dr-small-hp-mult=HP multiplier applied to small demolisher max health. Vanilla base = 30 000.
dr-medium-hp-mult=HP multiplier applied to medium demolisher max health. Vanilla base = 100 000.
dr-big-hp-mult=HP multiplier applied to big demolisher max health. Vanilla base = 300 000.
dr-enrage-seconds=How long (seconds) a demolisher stays enraged after a building is placed in its territory.
dr-hide-vanilla-territory=Hide the vanilla red territory overlay on the map. All territory intel then comes exclusively from seismograph coverage. Turn off for the vanilla red everywhere plus mod overlays gated by coverage.
dr-seismo-power-mw=Constant power draw of each seismograph station. It is listening to a planet; that costs.
dr-raw-rot-hours=Hours before a raw demolisher head spoils. Higher-quality heads last longer (native quality bonus).
dr-grace-period-min=Minutes after a territory becomes empty before it turns contested (yellow). 0 = instant.
dr-migration-delay-min=Minutes a contested territory must wait before a migrant worm is dispatched into it.
dr-migration-chance=Probability (0-1) that a migration is dispatched each time the interval rolls.
dr-migration-interval-min=How often (minutes) the game rolls for migration dispatches.
dr-seismo-radius-chunks=Detection radius of each seismograph in chunks. Quality adds +2 chunks per tier.
dr-head-drop-chance=Probability (0-1) that a killed demolisher drops its head.
dr-silence-window-min=Minutes an effigy keeps fooling the neighbours after its upkeep fails, before the deception collapses. Refill or re-socket within this window and no one notices.
dr-exposure-delay-factor=When an effigy is exposed, the territory is queued with this fraction of the normal migration delay remaining. 0.5 = half the usual warning. Lower = angrier neighbours.
dr-feed-per-min=Calcite and tungsten plates consumed per minute by an embalmed-head effigy while it has an audience (at least one occupied neighbouring territory).
dr-cryo-power-mw=Constant power draw of an effigy with a cryo-preserved head socketed.
dr-esc-distance-per-km=Effective HP bonus demolishers gain per 1000 tiles from the map origin. 0.5 = +50% EHP per km. Set 0 to disable.
dr-esc-per-kill=Effective HP bonus all demolishers gain per demolisher killed. They remember. Set 0 to disable.
dr-esc-kill-cap=Maximum total EHP bonus from the kill counter. 2.0 = the grudge caps at +200%.

