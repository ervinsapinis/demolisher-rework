[mod-name]
demolisher-rework=Demolisher Rework

[mod-description]
demolisher-rework=Smaller territories, migration-only repopulation, seismograph-gated territory intel, effigy deception, escalating demolisher toughness, build-trigger enrage.

[entity-name]
dr-seismograph=Seismograph station
dr-effigy=Territorial effigy
dr-effigy-power=Effigy cryogenic system

[entity-description]
dr-seismograph=Listens for the seismic signatures of demolishers. Reveals territory state (occupied, contested, effigy-held) on the map within its detection radius, and raises an alert when a migrating demolisher enters range. It listens; it does not see. Massive constant power draw.
dr-effigy=Socket a demolisher head and the neighbours will believe this territory is occupied. Raw heads rot. Embalmed heads must be fed calcite and tungsten while anyone is listening. Cryogenic heads need constant power. It is not alive. The neighbours do not know that. Keep it fed.

