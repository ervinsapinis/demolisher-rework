[mod-name]
demolisher-rework=Demolisher Rework

[mod-description]
demolisher-rework=Smaller territories, migration-only repopulation, seismograph-gated territory intel, three-tier effigy deception, escalating demolisher toughness, build-trigger enrage.

[entity-name]
dr-seismograph=Seismograph station
dr-effigy-small=Small territorial effigy
dr-effigy-medium=Medium territorial effigy
dr-effigy-big=Grand territorial effigy
dr-effigy-power=Effigy cryogenic system

[entity-description]
dr-seismograph=Listens for the seismic signatures of demolishers. A worm patrols its whole territory, so hearing any part of one reveals the full shape on the map, even into unexplored darkness. Raises an alert when a migrating demolisher enters range. It listens; it does not see. Massive constant power draw.
dr-effigy-small=Mounts a raw small demolisher head. Neighbouring small demolishers will believe this territory is occupied, until the head rots away. There is no preserving a small head: drying ruins it and cryogenics shatter it. Keep spares.
dr-effigy-medium=Mounts an embalmed medium demolisher head and fools demolishers up to medium size. The embalming must be fed: calcite and tungsten plate, consumed while there is an audience. A raw medium head falls apart if mounted; embalm it on or from Gleba first.
dr-effigy-big=Mounts a cryo-preserved big demolisher head and fools every demolisher there is. Demands constant refrigeration power; a brownout starts the clock on exposure. The lie becomes infrastructure. It is not alive. The neighbours do not know that.

