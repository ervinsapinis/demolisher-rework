[item-description]
dr-head-small-raw=Still warm. It will not keep. Socket it into a territorial effigy before it spoils.
dr-head-medium-raw=Heavy, pungent, and on a timer. The engineers refuse to carry it by hand.
dr-head-big-raw=An entire rocket, for one head. It had better be worth it. Spoils like everything else on this planet.
dr-head-small-embalmed=Gleba biochemistry keeps the tissue convincing indefinitely, provided the effigy is fed.
dr-head-medium-embalmed=The planet of rot taught us how to stop rot. It only eats calcite and tungsten now.
dr-head-big-embalmed=Preserved at considerable expense. The neighbours will believe a big one lives here, as long as the feed holds out.
dr-head-small-cryo=Frozen mid-snarl. Needs nothing but electricity, forever.
dr-head-medium-cryo=Aquilo cryogenics: the lie no longer rots, it only brownouts.
dr-head-big-cryo=The apex deception. One power outage away from a very bad week.

[technology-name]
dr-seismic-monitoring=Seismic monitoring
dr-demolisher-ethology=Demolisher ethology
dr-cadaver-embalming=Cadaver embalming
dr-cryogenic-taxidermy=Cryogenic taxidermy

[technology-description]
dr-seismic-monitoring=Seismograph stations reveal demolisher territory state on the map within their detection radius and warn of incoming migrations. Without coverage, the planet keeps its secrets.
dr-demolisher-ethology=Understanding of demolisher territorial behaviour. Unlocks the territorial effigy. Granted instantly the first time you kill a demolisher: standing over the corpse, you have an idea.
dr-cadaver-embalming=Gleba bioflux treatment stops a severed head from rotting. The effigy must be fed calcite and tungsten while there is an audience to deceive.
dr-cryogenic-taxidermy=Aquilo cryogenics preserve a head indefinitely with no feed at all, in exchange for constant refrigeration power. The lie becomes infrastructure.

